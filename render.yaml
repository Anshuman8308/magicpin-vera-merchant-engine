services:
  - type: web
    name: anshuman-merchant-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/healthz

    envVars:
      - key: LLM_PROVIDER
        value: groq

      - key: LLM_MODEL
        value: openai/gpt-oss-120b

      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-20b

      - key: LLM_SEED
        value: "20260426"

      - key: LLM_TIMEOUT_SECONDS
        value: "6"

      - key: LLM_API_KEY
        sync: false

      - key: BOT_TEAM_NAME
        value: Anshuman Singh Vera Merchant Engine

      - key: BOT_TEAM_MEMBERS
        value: Anshuman Singh

      - key: BOT_MODEL
        value: openai/gpt-oss-120b

      - key: BOT_APPROACH
        value: Hybrid Groq composer with deterministic templates, playbooks, and hydration fallbacks

      - key: BOT_CONTACT_EMAIL
        value: anshuman83080@gmail.com

      - key: BOT_VERSION
        value: "1.0.0"
